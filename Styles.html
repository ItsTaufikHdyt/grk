<style>
:root {
  --primary: #0f6cbd;
  --primary-dark: #0b3a63;
  --primary-light: #e7f1fb;
  --green: #15803d;
  --green-light: #e8f6ed;
  --red: #c2410c;
  --red-light: #fdf0e8;
  --amber: #d97706;
  --amber-light: #fdf5e6;
  --background: #f3f6f9;
  --card: #ffffff;
  --text: #1b2a3a;
  --text-soft: #3d4f63;
  --muted: #64748b;
  --border: #e2e8f0;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(15, 35, 60, .04), 0 6px 20px rgba(15, 35, 60, .05);
}

[hidden] { display: none !important; }

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: "Plus Jakarta Sans", Inter, Arial, Helvetica, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  background: var(--background);
  color: var(--text);
}

button, select, input { font-family: inherit; }

b, strong { font-weight: 700; }

/* =========================
   SIDEBAR
========================= */
.sidebar {
  position: fixed;
  width: 260px;
  top: 0;
  left: 0;
  bottom: 0;
  background: #fff;
  border-right: 1px solid var(--border);
  padding: 22px 14px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 22px;
}

.brand-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: linear-gradient(135deg, #0f6cbd, #15803d);
  font-size: 22px;
}

.brand-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--primary-dark);
  line-height: 1.2;
}

.brand-subtitle {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
}

.nav { flex: 1; }

.menu-label {
  padding: 16px 12px 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #94a3b8;
}

.nav-item {
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  padding: 10px 12px;
  border-radius: 12px;
  cursor: pointer;
  color: var(--text-soft);
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 3px;
  transition: background .15s;
}

.nav-item:hover { background: #f1f5f9; }

.nav-item:focus-visible {
  outline: 3px solid rgba(15, 108, 189, .35);
  outline-offset: 1px;
}

.nav-item.active {
  background: var(--primary-light);
  color: var(--primary);
}

.nav-icon {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: #f1f5f9;
  font-size: 17px;
}

.nav-item.active .nav-icon { background: #fff; }

.nav-text { display: flex; flex-direction: column; min-width: 0; }
.nav-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
.nav-desc { font-size: 12px; color: var(--muted); line-height: 1.3; }

.sidebar-footer {
  padding: 16px 12px 0;
  font-size: 11px;
  color: #94a3b8;
  line-height: 1.6;
}

.sidebar-footer strong { display: block; color: #64748b; }

/* =========================
   MAIN & HERO
========================= */
.main {
  margin-left: 260px;
  padding: 24px 32px;
  min-height: 100vh;
  max-width: 1500px;
}

.hero {
  border-radius: 24px;
  padding: 34px 40px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  background:
    radial-gradient(circle at 90% 10%, rgba(21, 128, 61, .18), transparent 45%),
    linear-gradient(120deg, #e6f1fb 0%, #eef8f2 100%);
  border: 1px solid #dbe8f3;
}

.hero-eyebrow {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--primary);
  margin-bottom: 10px;
}

.hero h1 {
  margin: 0;
  max-width: 720px;
  font-size: 32px;
  line-height: 1.2;
  color: var(--primary-dark);
}

.hero p {
  margin: 12px 0 18px;
  max-width: 680px;
  color: var(--text-soft);
  font-size: 15px;
}

.btn-ghost {
  border: 1px solid #bcd3e8;
  background: rgba(255, 255, 255, .8);
  color: var(--primary-dark);
  padding: 9px 16px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.btn-ghost:hover { background: #fff; }

.hero-filter,
.filter-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 14px;
}

.hero-filter {
  min-width: 170px;
  box-shadow: var(--shadow);
}

.hero-filter label,
.filter-card label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 4px;
}

.hero-filter select,
.filter-card select {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-weight: 800;
  font-size: 18px;
  cursor: pointer;
}

/* =========================
   PAGE
========================= */
.page { display: none; padding-top: 28px; }
.page.active { display: block; animation: fadeIn .25s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 18px;
}

.page-heading h2 { margin: 0; font-size: 24px; color: var(--primary-dark); }
.page-heading p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

.filter-group { display: flex; gap: 10px; }
.filter-card { min-width: 160px; }

.section-divider {
  height: 1px;
  background: var(--border);
  margin: 36px 0 8px;
}

/* =========================
   EXPLAIN BOX & INSIGHT
========================= */
.explain-box {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 18px;
  margin-bottom: 18px;
  border-radius: 14px;
  background: var(--primary-light);
  border: 1px solid #cfe2f4;
  color: var(--text-soft);
  font-size: 14px;
}

.explain-box.green { background: var(--green-light); border-color: #cbe8d5; }
.explain-icon { font-size: 20px; line-height: 1.3; }

.insight-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.insight-pill {
  background: #fff;
  border: 1px solid var(--border);
  border-left: 4px solid var(--primary);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  color: var(--text-soft);
}

.insight-pill.good { border-left-color: var(--green); }
.insight-pill.bad { border-left-color: var(--red); }

.insight {
  display: flex;
  gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid #eef2f6;
  font-size: 14px;
  color: var(--text-soft);
}

.insight:last-child { border-bottom: 0; }
.insight-icon { font-size: 18px; line-height: 1.4; }

/* =========================
   CARD & KPI
========================= */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.kpi-grid.three { grid-template-columns: repeat(3, 1fr); }

.kpi {
  position: relative;
  overflow: hidden;
  border-top: 4px solid var(--primary);
}

.kpi-accent-blue { border-top-color: var(--primary); }
.kpi-accent-amber { border-top-color: var(--amber); }
.kpi-accent-green { border-top-color: var(--green); }
.kpi-accent-red { border-top-color: var(--red); }
.kpi-accent-slate { border-top-color: #64748b; }

.kpi-top { display: flex; align-items: center; gap: 8px; }
.kpi-icon { font-size: 18px; }

.kpi-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.kpi-value {
  margin-top: 12px;
  font-size: 30px;
  font-weight: 800;
  color: var(--primary-dark);
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  word-break: break-word;
}

.kpi-value.text { font-size: 24px; }
.kpi-value.text.small { font-size: 19px; }
.kpi-value.removal { color: var(--green); }
.kpi-value.good { color: var(--green); }
.kpi-value.bad { color: var(--red); }

.kpi-unit { margin-top: 2px; font-size: 13px; color: var(--muted); }

.kpi-human {
  margin-top: 8px;
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  background: #f1f5f9;
  padding: 3px 10px;
  border-radius: 999px;
}

.kpi-human:empty { display: none; }

.kpi-footer { margin-top: 12px; font-size: 13px; color: var(--muted); }

.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.badge.good { background: var(--green-light); color: var(--green); }
.badge.bad { background: var(--red-light); color: var(--red); }
.badge.neutral { background: #f1f5f9; color: var(--muted); }

/* =========================
   CHART
========================= */
.grid-main {
  display: grid;
  grid-template-columns: minmax(0, 1.8fr) minmax(300px, 1fr);
  gap: 16px;
  margin-top: 16px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin-top: 16px;
}

.chart-card { overflow: hidden; margin-top: 16px; }
.grid-main .chart-card, .grid-2 .chart-card { margin-top: 0; }

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}

.card-header h3 { margin: 0; font-size: 17px; color: var(--text); }
.card-header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

.chart { height: 340px; }
.large-chart { height: 420px; }
.all-sector-chart { width: 100%; height: 480px; }
.national-chart { width: 100%; height: 480px; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--muted);
  font-size: 14px;
  text-align: center;
  background: #f8fafc;
  border: 1px dashed var(--border);
  border-radius: 12px;
}

.empty-state::before { content: "📭"; font-size: 26px; }

.chart-legend-help {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}

.chart-legend-help span { display: flex; align-items: center; gap: 7px; }
.chart-legend-help i { display: inline-block; }
.legend-bar { width: 12px; height: 12px; border-radius: 3px; background: linear-gradient(90deg, #f59e0b 50%, #7c3aed 50%); }
.legend-line { width: 18px; height: 3px; background: #1e293b; border-radius: 2px; }
.legend-neg { width: 12px; height: 12px; border-radius: 3px; background: #15803d; }

/* =========================
   SECTOR LIST
========================= */
.sector-item { padding: 12px 0; border-bottom: 1px solid #eef2f6; }
.sector-item:last-child { border-bottom: 0; }

.sector-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
}

.sector-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
}

.sector-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-block;
}

.sector-value { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sector-value.negative { color: var(--green); }
.sector-meta { margin-top: 4px; font-size: 12px; color: var(--muted); }

.progress {
  margin-top: 7px;
  height: 8px;
  background: #eef2f6;
  border-radius: 999px;
  overflow: hidden;
}

.progress > span { display: block; height: 100%; border-radius: 999px; }

.sector-hero {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 16px 20px;
  margin-bottom: 16px;
  border-radius: 16px;
  background: #fff;
  border: 1px solid var(--border);
  border-left-width: 6px;
}

.sector-hero:empty { display: none; }
.sector-hero-icon { font-size: 30px; }
.sector-hero h3 { margin: 0; font-size: 18px; }
.sector-hero p { margin: 2px 0 0; color: var(--text-soft); font-size: 14px; }

/* =========================
   TABLE
========================= */
.table-card { margin-top: 16px; }

.table-wrapper {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

.data-table th {
  text-align: left;
  padding: 12px 14px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-soft);
  background: #f5f8fb;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.data-table td {
  padding: 12px 14px;
  font-size: 14px;
  border-bottom: 1px solid #eef2f6;
  white-space: nowrap;
}

.data-table tbody tr:nth-child(even) td { background: #fbfcfd; }
.data-table tbody tr:hover td { background: #f3f8fd; }
.data-table tbody tr:last-child td { border-bottom: 0; }

.data-table .num { text-align: right; }
.data-table td.negative { color: var(--green); font-weight: 700; }
.data-table td.missing { color: #94a3b8; }
.data-table .year-cell { font-weight: 700; }

.data-table .total-row td {
  background: #eef6ff !important;
  font-weight: 800;
  color: var(--primary-dark);
  border-top: 2px solid #c7dcf0;
}

.matrix .sticky-col {
  position: sticky;
  left: 0;
  z-index: 1;
  background: #fff;
  min-width: 170px;
  box-shadow: 1px 0 0 var(--border);
}

.matrix th.sticky-col { background: #f5f8fb; z-index: 2; }
.matrix tbody tr:nth-child(even) .sticky-col { background: #fbfcfd; }
.matrix .total-row .sticky-col { background: #eef6ff !important; }

.share-cell { min-width: 180px; }
.share-cell .progress { margin-top: 0; flex: 1; }
.share-wrap { display: flex; align-items: center; gap: 10px; }
.share-wrap span.share-text { width: 52px; text-align: right; font-weight: 700; }

/* =========================
   FORM
========================= */
.form-container { max-width: 680px; margin: 0 auto; }

.form-user {
  margin-bottom: 18px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--green-light);
  color: #1f5135;
  font-size: 14px;
}

.form-user:empty { display: none; }

.form-step {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.step-num {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  margin-top: 24px;
  border-radius: 50%;
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 800;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.form-step > .form-group, .form-step > .form-row { flex: 1; min-width: 0; }

.form-group { margin-bottom: 16px; }
.form-row { display: flex; gap: 16px; }
.form-group.col { flex: 1; }

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-soft);
  margin-bottom: 6px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
  background: #fff;
  font-size: 15px;
  color: var(--text);
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15, 108, 189, .15);
}

.form-help { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }

.btn-primary {
  width: 100%;
  padding: 13px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s;
}

.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { background: #94a3b8; cursor: wait; }

.searchable-select-wrapper { position: relative; width: 100%; }

.search-options-list {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 240px;
  overflow-y: auto;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .12);
  z-index: 50;
}

.search-option-item {
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
  border-bottom: 1px solid #f1f5f9;
}

.search-option-item:last-child { border-bottom: none; }
.search-option-item:hover { background: var(--primary-light); color: var(--primary); }
.search-option-item small { color: var(--muted); margin-right: 6px; }
.search-option-empty { padding: 12px 14px; font-size: 13px; color: var(--muted); text-align: center; }

/* =========================
   MODAL
========================= */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(11, 58, 99, .45);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-card {
  background: #fff;
  border-radius: var(--radius);
  width: 100%;
  max-width: 380px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, .2);
}

.modal-card.wide { max-width: 720px; }

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.modal-header h3 { margin: 0; font-size: 19px; color: var(--primary-dark); }
.modal-desc { margin: 0 0 16px; font-size: 13px; color: var(--muted); }

.btn-close {
  background: #f1f5f9;
  border: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 15px;
  cursor: pointer;
  color: var(--muted);
}

.login-error {
  color: var(--red);
  background: var(--red-light);
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 12px;
}

.guide-body {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.guide-item {
  padding: 14px 16px;
  border-radius: 12px;
  background: #f8fafc;
  border: 1px solid var(--border);
}

.guide-item h4 { margin: 0 0 6px; font-size: 15px; }
.guide-item p { margin: 0; font-size: 14px; color: var(--text-soft); }

/* =========================
   TOAST, FOOTER, LOADING
========================= */
.toast-container {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 1100;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: min(420px, calc(100vw - 40px));
}

.toast {
  padding: 13px 16px;
  border-radius: 12px;
  background: #1e293b;
  color: #fff;
  font-size: 14px;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .2);
  animation: fadeIn .2s ease;
}

.toast.success { background: #166534; }
.toast.error { background: #b91c1c; }

.footer {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 30px;
  padding: 18px 4px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: #94a3b8;
}

.loading {
  position: fixed;
  inset: 0;
  background: rgba(243, 246, 249, .9);
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-size: 14px;
  color: var(--text-soft);
}

.loader {
  width: 38px;
  height: 38px;
  border: 4px solid #dbe6f0;
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* =========================
   RESPONSIVE
========================= */
@media (max-width: 1200px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 960px) {
  /* Sidebar berubah menjadi menu atas yang bisa digeser */
  .sidebar {
    position: sticky;
    width: auto;
    bottom: auto;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
    overflow: visible;
  }

  .brand { padding: 0; }

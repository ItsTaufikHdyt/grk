<script>
  google.charts.load("current", { packages: ["corechart"], language: "id" });

  /* =========================
     KONFIGURASI TAMPILAN SEKTOR
  ========================= */
  const SECTOR_INFO = {
    ENERGI: { label: "Energi", color: "#f59e0b", icon: "⚡", desc: "Pembakaran bahan bakar untuk listrik, industri, dan kendaraan." },
    IPPU: { label: "Proses Industri (IPPU)", color: "#7c3aed", icon: "🏭", desc: "Gas yang keluar dari proses industri dan pemakaian produk tertentu (bukan dari bahan bakar)." },
    PERTANIAN: { label: "Pertanian", color: "#65a30d", icon: "🌾", desc: "Peternakan, pemupukan, dan pengelolaan lahan pertanian." },
    KEHUTANAN: { label: "Kehutanan", color: "#059669", icon: "🌳", desc: "Hutan dan penggunaan lahan. Nilai negatif berarti hutan menyerap karbon." },
    FOLU: { label: "Hutan & Lahan (FOLU)", color: "#059669", icon: "🌳", desc: "Kehutanan dan penggunaan lahan lainnya. Nilai negatif berarti karbon diserap." },
    LIMBAH: { label: "Limbah", color: "#b45309", icon: "🗑️", desc: "Pengelolaan sampah dan air limbah rumah tangga maupun industri." },
  };
  const FALLBACK_COLORS = ["#0ea5e9", "#e11d48", "#14b8a6", "#a855f7", "#64748b"];
  const TOTAL_COLOR = "#1e293b";
  const REMOVAL_COLOR = "#15803d";
  const EMISSION_COLOR = "#c2410c";

  function sectorInfo(code) {
    const key = String(code || "").trim().toUpperCase();
    if (SECTOR_INFO[key]) return SECTOR_INFO[key];
    const index = Math.abs([...key].reduce((h, c) => h + c.charCodeAt(0), 0)) % FALLBACK_COLORS.length;
    return { label: key, color: FALLBACK_COLORS[index], icon: "●", desc: "" };
  }

  /* =========================
     STATE
  ========================= */
  const app = {
    years: [],
    sectors: [],
    year: null,
    page: "summary",
    session: readStoredSession(),
    masterForm: { sektorList: [], subsektorList: [] },
    activeSubsektors: [],
    cache: {},
    seq: {},
    current: {},
  };

  function readStoredSession() {
    try {
      return JSON.parse(sessionStorage.getItem("grk_session") || "null");
    } catch (e) {
      return null;
    }
  }

  function storeSession(session) {
    app.session = session;
    try {
      if (session) sessionStorage.setItem("grk_session", JSON.stringify(session));
      else sessionStorage.removeItem("grk_session");
    } catch (e) {
      /* sessionStorage bisa diblokir; sesi tetap berlaku di memori */
    }
  }

  /** Membungkus google.script.run menjadi Promise. */
  function call(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName](...args);
    });
  }

  /** Mengambil data dengan cache di browser; cache dihapus setiap ada data baru disimpan. */
  function cached(key, loader) {
    if (!(key in app.cache)) {
      app.cache[key] = loader().catch((err) => {
        delete app.cache[key];
        throw err;
      });
    }
    return app.cache[key];
  }

  /** Menandai request terbaru per halaman agar respons lama tidak menimpa yang baru. */
  function nextSeq(name) {
    app.seq[name] = (app.seq[name] || 0) + 1;
    return app.seq[name];
  }

  function isLatest(name, seq) {
    return app.seq[name] === seq;
  }

  google.charts.setOnLoadCallback(init);

  /* =========================
     INISIALISASI
  ========================= */
  async function init() {
    showLoading();
    renderGuideSectors();

    try {
      const [initial] = await Promise.all([call("getInitialData"), restoreSession()]);
      applyInitialData(initial);
      updateAuthUI();
      openPage("summary");
      loadMasterFormData();
    } catch (err) {
      handleError(err);
    } finally {
      hideLoading();
    }
  }

  function applyInitialData(data) {
    app.years = data.years || [];
    app.sectors = data.sectors || [];
    if (!app.years.includes(app.year)) app.year = data.latestYear;
    setupFilters();
  }

  async function restoreSession() {
    if (!app.session || !app.session.token) return;
    try {
      const result = await call("validateSession", app.session.token);
      if (result) storeSession({ token: app.session.token, user: result.user, canWrite: result.canWrite });
      else storeSession(null);
    } catch (e) {
      storeSession(null);
    }
  }

  function loadMasterFormData() {
    call("getMasterFormData")
      .then((res) => {
        app.masterForm = res;
        populateSektorOptions();
      })
      .catch((err) => console.error(err));
  }

  /* =========================
     NAVIGASI & FILTER
  ========================= */
  function setupFilters() {
    populateSelect("globalYear", app.years.map((y) => ({ value: y, label: y })), app.year);
    populateSelect(
      "categorySector",
      app.sectors.map((s) => ({ value: s, label: sectorInfo(s).label })),
      document.getElementById("categorySector").value || app.sectors[0]
    );

    const ascending = [...app.years].sort((a, b) => a - b).map((y) => ({ value: y, label: y }));
    populateSelect("trendStartYear", ascending, ascending.length ? ascending[0].value : null);
    populateSelect("trendEndYear", ascending, ascending.length ? ascending[ascending.length - 1].value : null);
  }

  function populateSelect(id, items, selected) {
    const element = document.getElementById(id);
    if (!element) return;
    element.innerHTML = "";
    items.forEach((item) => {
      const option = document.createElement("option");
      option.value = item.value;
      option.textContent = item.label;
      option.selected = String(item.value) === String(selected);
      element.appendChild(option);
    });
  }

  function openPage(page) {
    if (page === "input" && !(app.session && app.session.canWrite)) {
      openLoginModal();
      return;
    }

    app.page = page;
    document.querySelectorAll(".page").forEach((el) => el.classList.toggle("active", el.id === "page-" + page));
    document.querySelectorAll(".nav-item[data-page]").forEach((el) => el.classList.toggle("active", el.dataset.page === page));

    const yearFilterPages = ["summary", "sector", "forestry"];
    document.getElementById("heroYearFilter").hidden = !yearFilterPages.includes(page);

    switch (page) {
      case "summary": loadSummary(); break;
      case "trend": loadTrendPage(); loadEconomicData(); break;
      case "national": loadNationalPage(); break;
      case "sector": loadCategoryPage(); break;
      case "forestry": loadForestryPage(); break;
      case "input": renderFormUser(); break;
    }
  }

  function globalYearChanged() {
    app.year = Number(document.getElementById("globalYear").value);
    if (app.page === "summary") loadSummary();
    if (app.page === "sector") loadCategoryPage();
    if (app.page === "forestry") loadForestryPage();
  }

  /* =========================
     RINGKASAN
  ========================= */
  async function loadSummary() {
    if (!app.year) return showNoData();
    const seq = nextSeq("summary");
    showLoading();
    try {
      const data = await cached("summary:" + app.year, () => call("getSummaryData", app.year));
      if (!isLatest("summary", seq)) return;
      app.current.summary = data;
      renderSummary(data);
    } catch (err) {
      handleError(err);
    } finally {
      hideLoading();
    }
  }

  function showNoData() {
    text("summaryYearLabel", "-");
    showEmpty("summaryBarChart", "Belum ada data emisi di spreadsheet.");
    showEmpty("summaryTrendChart", "Belum ada data emisi di spreadsheet.");
  }

  function renderSummary(data) {
    text("summaryYearLabel", data.year);
    text("summaryTotal", formatNumber(data.total));
    text("summaryTotalHuman", data.sectors.length ? "≈ " + humanTon(data.total) + " CO₂e" : "");

    if (data.largestSector) {
      const info = sectorInfo(data.largestSector.sektor);
      const share = data.grossEmission ? (data.largestSector.nilai / data.grossEmission) * 100 : 0;
      text("summaryLargest", info.icon + " " + info.label);
      text("summaryLargestValue", formatNumber(data.largestSector.nilai) + " kt CO₂e");
      text("summaryLargestPercent", formatPercent(share) + " dari seluruh emisi");
    } else {
      text("summaryLargest", "-");
      text("summaryLargestValue", "Belum ada data");
      text("summaryLargestPercent", "");
    }

    renderChangeKpi("summaryChangeValue", "summaryChange", data.changePercent, data.previousYear, false, "emisi");

    if (data.totalRemoval > 0) {
      const offset = data.grossEmission ? (data.totalRemoval / data.grossEmission) * 100 : 0;
      text("summaryRemoval", formatNumber(data.totalRemoval));
      text("summaryRemovalNote", "Mengimbangi " + formatPercent(offset) + " dari seluruh emisi");
    } else {
      text("summaryRemoval", "0");
      text("summaryRemovalNote", "Tidak ada serapan tercatat tahun ini");
    }

    renderSummaryBar(data);
    renderSectorList(data);
    renderSummaryTrend(data);
    renderSummaryInsights(data);
  }

  function renderSummaryBar(data) {
    text("summaryBarSubtitle", "Tahun " + data.year + " • kt CO₂e • batang lebih panjang = emisi lebih besar");
    if (!data.sectors.length) return showEmpty("summaryBarChart", "Belum ada data untuk tahun " + data.year + ".");

    drawColoredBar(
      "summaryBarChart",
      data.sectors.map((s) => ({
        label: sectorInfo(s.sektor).label,
        value: s.nilai,
        color: s.nilai < 0 ? REMOVAL_COLOR : sectorInfo(s.sektor).color,
      }))
    );
  }

  function renderSectorList(data) {
    const container = document.getElementById("summarySectorList");
    if (!data.sectors.length) {
      container.innerHTML = '<div class="empty-state" style="height:200px">Belum ada data.</div>';
      return;
    }

    container.innerHTML = data.sectors
      .map((item) => {
        const info = sectorInfo(item.sektor);
        const negative = item.nilai < 0;
        const share = !negative && data.grossEmission ? (item.nilai / data.grossEmission) * 100 : 0;
        return `
          <div class="sector-item">
            <div class="sector-row">
              <div class="sector-name"><span class="sector-dot" style="background:${info.color}"></span>${escapeHtml(info.label)}</div>
              <div class="sector-value ${negative ? "negative" : ""}">${formatNumber(item.nilai)}</div>
            </div>
            ${negative
              ? `<div class="sector-meta">🌱 Menyerap ${formatNumber(Math.abs(item.nilai))} kt CO₂e</div>`
              : `<div class="progress"><span style="width:${Math.min(share, 100)}%;background:${info.color}"></span></div>
                 <div class="sector-meta">${formatPercent(share)} dari seluruh emisi</div>`}
          </div>`;
      })
      .join("");
  }

  function renderSummaryTrend(data) {
    if (!data.totalTrend.length) return showEmpty("summaryTrendChart", "Belum ada data tren.");
    drawLine("summaryTrendChart", ["Total emisi bersih"], data.totalTrend.map((t) => [t.tahun, t.nilai]), {
      colors: [TOTAL_COLOR]
    });
  }

  function renderSummaryInsights(data) {
    const items = [];

    if (data.largestSector) {
      const info = sectorInfo(data.largestSector.sektor);
      const share = data.grossEmission ? (data.largestSector.nilai / data.grossEmission) * 100 : 0;
      items.push(["🏆", `Penyumbang emisi terbesar tahun ${data.year} adalah sektor <strong>${escapeHtml(info.label)}</strong>, yaitu sekitar <strong>${formatPercent(share)}</strong> dari seluruh emisi.`]);
    }

    if (data.changePercent !== null && data.changePercent !== undefined) {
      const up = data.changePercent > 0;
      items.push([up ? "📈" : "📉", `Dibanding ${data.previousYear}, total emisi bersih <strong>${up ? "naik" : "turun"} ${formatPercent(Math.abs(data.changePercent))}</strong>. ${up ? "Artinya emisi bertambah." : "Artinya emisi berkurang, ini kabar baik."}`]);
    }

    if (data.totalRemoval > 0) {
      items.push(["🌳", `Hutan dan lahan menyerap <strong>${formatNumber(data.totalRemoval)} kt CO₂e</strong> (≈ ${humanTon(data.totalRemoval)}), membantu mengurangi emisi bersih kota.`]);
    }

    if (data.sectors.length) {
      items.push(["🌫️", `Total emisi bersih ${data.year} setara dengan sekitar <strong>${humanTon(data.total)}</strong> karbon dioksida.`]);
    }

    document.getElementById("summaryInsights").innerHTML = items.length
      ? items.map(([icon, html]) => `<div class="insight"><span class="insight-icon">${icon}</span><div>${html}</div></div>`).join("")
      : '<div class="insight">Belum ada data untuk disimpulkan.</div>';
  }

  /* =========================
     TREN EMISI BONTANG
  ========================= */
  async function loadTrendPage() {
    const seq = nextSeq("trend");
    showLoading();
    try {
      const data = await cached("trend", () => call("getAllSectorTrend"));
      if (!isLatest("trend", seq)) return;
      app.current.trend = data;
      renderAllSectorTrend();
    } catch (err) {
      handleError(err);
    } finally {
      hideLoading();
    }
  }

  function getYearRange(startId, endId) {
    let start = Number(document.getElementById(startId).value);
    let end = Number(document.getElementById(endId).value);
    if (start > end) [start, end] = [end, start];
    return [start, end];
  }

  function renderAllSectorTrend() {
    const source = app.current.trend;
    if (!source) return;

    const [start, end] = getYearRange("trendStartYear", "trendEndYear");
    const data = source.data.filter((d) => d.tahun >= start && d.tahun <= end);

    renderTrendInsights(source.sectors, data);

    if (!data.length) {
      showEmpty("allSectorTrendChart", "Tidak ada data pada rentang tahun ini.");
    } else {
      drawSectorCombo("allSectorTrendChart", source.sectors, data, { stacked: false, totalLabel: "Total emisi bersih" });
    }
    renderMatrixTable("allSectorTableHead", "allSectorTableBody", source.sectors, data);
  }

  function renderTrendInsights(sectors, data) {
    const box = document.getElementById("trendInsights");
    if (data.length < 2) {
      box.innerHTML = "";
      return;
    }

    const first = data[0];
    const last = data[data.length - 1];
    const pills = [];

    if (first.total !== 0) {
      const change = ((last.total - first.total) / Math.abs(first.total)) * 100;
      const up = change > 0;
      pills.push([up ? "bad" : "good", `${up ? "📈" : "📉"} Dari ${first.tahun} ke ${last.tahun}, total emisi bersih <strong>${up ? "naik" : "turun"} ${formatPercent(Math.abs(change))}</strong>.`]);
    }

    const peak = data.reduce((max, d) => (d.total > max.total ? d : max), data[0]);
    pills.push(["", `🔝 Emisi tertinggi terjadi pada tahun <strong>${peak.tahun}</strong> (${formatNumber(peak.total)} kt CO₂e).`]);

    let biggest = null;
    sectors.forEach((s) => {
      const diff = (last.values[s] || 0) - (first.values[s] || 0);
      if (!biggest || Math.abs(diff) > Math.abs(biggest.diff)) biggest = { sector: s, diff };
    });
    if (biggest && biggest.diff !== 0) {
      const up = biggest.diff > 0;
      pills.push([up ? "bad" : "good", `🔄 Perubahan terbesar ada di sektor <strong>${escapeHtml(sectorInfo(biggest.sector).label)}</strong>, ${up ? "bertambah" : "berkurang"} ${formatNumber(Math.abs(biggest.diff))} kt CO₂e.`]);
    }

    box.innerHTML = pills.map(([cls, html]) => `<div class="insight-pill ${cls}">${html}</div>`).join("");
  }

  /* =========================
     EKONOMI & INTENSITAS
  ========================= */
  async function loadEconomicData() {
    const seq = nextSeq("economic");
    try {
      const data = await cached("economic", () => call("getEconomicData"));
      if (!isLatest("economic", seq)) return;
      app.current.economic = data;
      renderEconomicData(data);
    } catch (err) {
      console.error(err);
      showEconomicEmptyState("Data ekonomi belum dapat dimuat.");
    }
  }

  function showEconomicEmptyState(message) {
    ["economicTotalEmisi", "economicAdhk", "economicIntensity"].forEach((id) => text(id, "-"));
    text("economicAdhkYear", "-");
    text("economicTotalEmisiYear", "kt CO₂e");
    ["economicTotalEmisiChange", "economicAdhkChange", "economicIntensityChange"].forEach((id) => text(id, ""));
    document.getElementById("economicCombinedTableBody").innerHTML =
      `<tr><td colspan="4" class="missing">${escapeHtml(message)}</td></tr>`;
    showEmpty("economicAdhkChart", message);
    showEmpty("economicIntensityChart", message);
  }

  function renderEconomicData(data) {
    if (!data || !Array.isArray(data.data) || !data.data.length) {
      showEconomicEmptyState("Data ekonomi belum tersedia.");
      return;
    }

    const rows = data.data;
    const latest = rows[rows.length - 1];
    const previous = rows.length > 1 ? rows[rows.length - 2] : null;

    text("economicTotalEmisi", formatNumber(latest.totalEmisiGg));
    text("economicTotalEmisiYear", "kt CO₂e • tahun " + latest.tahun);
    text("economicAdhk", formatNumber(latest.adhk));
    text("economicAdhkYear", "Tahun " + latest.tahun);
    text("economicIntensity", formatNumber(latest.intensitasGrk, 4));

    renderChangeFooter("economicTotalEmisiChange", latest.totalEmisiGg, previous && previous.totalEmisiGg, previous && previous.tahun, false);
    renderChangeFooter("economicAdhkChange", latest.adhk, previous && previous.adhk, previous && previous.tahun, true);
    renderChangeFooter("economicIntensityChange", latest.intensitasGrk, previous && previous.intensitasGrk, previous && previous.tahun, false);

    const adhkRows = rows.filter((r) => r.adhk !== null).map((r) => [r.tahun, r.adhk]);
    const intensityRows = rows.filter((r) => r.intensitasGrk !== null).map((r) => [r.tahun, r.intensitasGrk]);

    if (adhkRows.length) {
      drawLine("economicAdhkChart", ["ADHK"], adhkRows, { colors: ["#d97706"], vTitle: "ADHK" });
    } else {
      showEmpty("economicAdhkChart", "Data ADHK belum tersedia.");
    }

    if (intensityRows.length) {
      drawLine("economicIntensityChart", ["Intensitas GRK"], intensityRows, {
        colors: ["#15803d"],
        vTitle: "kt CO₂e / ADHK",
        decimals: 4,
      });
    } else {
      showEmpty("economicIntensityChart", "Data intensitas belum tersedia.");
    }

    const cell = (v, d) => (v === null || v === undefined ? '<td class="num missing">—</td>' : `<td class="num">${formatNumber(v, d)}</td>`);
    document.getElementById("economicCombinedTableBody").innerHTML = [...rows]
      .sort((a, b) => b.tahun - a.tahun)
      .map((r) => `<tr><td class="year-cell">${r.tahun}</td>${cell(r.totalEmisiGg)}${cell(r.adhk)}${cell(r.intensitasGrk, 4)}</tr>`)
      .join("");
  }

  /* =========================
     RINCIAN PER SEKTOR
  ========================= */
  async function loadCategoryPage() {
    const sector = document.getElementById("categorySector").value;
    const year = app.year;
    if (!sector || !year) return;

    renderSectorDescription(sector);
    const seq = nextSeq("category");
    showLoading();

    try {
      const [data, trend] = await Promise.all([
        cached(`category:${year}:${sector}`, () => call("getCategoryData", year, sector)),
        cached(`categoryTrend:${sector}`, () => call("getCategoryTrend", sector)),
      ]);
      if (!isLatest("category", seq)) return;
      app.current.category = data;
      app.current.categoryTrend = trend;
      renderCategory(data, trend);
    } catch (err) {
      handleError(err);
    } finally {
      hideLoading();
    }
  }

  function renderSectorDescription(sector) {
    const info = sectorInfo(sector);
    const box = document.getElementById("sectorDescription");
    box.style.borderLeftColor = info.color;
    box.innerHTML = `
      <span class="sector-hero-icon">${info.icon}</span>
      <div>
        <h3>${escapeHtml(info.label)}</h3>
        <p>${escapeHtml(info.desc || "Rincian emisi pada sektor ini.")}</p>
      </div>`;
  }

  function renderCategory(data, trend) {
    const info = sectorInfo(data.sector);
    const hasData = data.categories.length > 0;

    text("categoryTotal", hasData ? formatNumber(data.total) : "-");
    text("categoryTotalHuman", hasData ? "≈ " + humanTon(data.total) + " CO₂e" : "");
    text("categoryCount", hasData ? data.categoryCount : "0");

    if (data.largestCategory) {
      text("largestCategory", data.largestCategory.kategori);
      text("largestCategoryValue", formatNumber(data.largestCategory.nilai) + " kt CO₂e");
    } else {
      text("largestCategory", "-");
      text("largestCategoryValue", hasData ? "Tidak ada emisi positif" : "Belum ada data tahun " + data.year);
    }

    text("categoryBarTitle", `Emisi tiap subsektor ${info.label} — ${data.year}`);
    text("categoryTrendTitle", `Perkembangan subsektor ${info.label}`);

    if (hasData) {
      drawColoredBar(
        "categoryBarChart",
        data.categories.map((c) => ({ label: c.kategori, value: c.nilai, color: c.nilai < 0 ? REMOVAL_COLOR : info.color }))
      );
    } else {
      showEmpty("categoryBarChart", `Belum ada rincian subsektor ${info.label} untuk tahun ${data.year}.`);
    }

    renderCategoryTrend(trend);
    renderCategoryTable(data, info);
  }

  function renderCategoryTrend(trend) {
    if (!trend.data.length || !trend.categories.length) {
      return showEmpty("categoryTrendChart", "Belum ada data tren untuk sektor ini.");
    }
    const rows = trend.data.map((d) => [d.tahun, ...trend.categories.map((c) => (d.values[c] ?? null))]);
    drawLine("categoryTrendChart", trend.categories, rows, { legendBottom: true });
  }

  function renderCategoryTable(data, info) {
    const body = document.getElementById("categoryTable");
    if (!data.categories.length) {
      body.innerHTML = '<tr><td colspan="3" class="missing">Belum ada data.</td></tr>';
      return;
    }

    body.innerHTML = data.categories
      .map((item) => {
        const negative = item.nilai < 0;
        const share = !negative && data.grossEmission ? (item.nilai / data.grossEmission) * 100 : 0;
        const shareCell = negative
          ? '<span class="badge good">🌱 Serapan</span>'
          : `<div class="share-wrap"><div class="progress"><span style="width:${Math.min(share, 100)}%;background:${info.color}"></span></div><span class="share-text">${formatPercent(share)}</span></div>`;
        return `
          <tr>
            <td>${escapeHtml(item.kategori)}</td>
            <td class="num ${negative ? "negative" : ""}">${formatNumber(item.nilai)}</td>
            <td class="share-cell">${shareCell}</td>
          </tr>`;
      })
      .join("");
  }

  /* =========================
     HUTAN & SERAPAN
  ========================= */
  async function loadForestryPage() {
    if (!app.year) return;
    const seq = nextSeq("forestry");
    showLoading();
    try {
      const data = await cached("forestry:" + app.year, () => call("getForestryData", app.year));
      if (!isLatest("forestry", seq)) return;
      app.current.forestry = data;
      renderForestry(data);
    } catch (err) {
      handleError(err);
    } finally {
      hideLoading();
    }
  }

  function renderForestry(data) {
    const hasData = data.categories.length > 0;

    text("forestryRemoval", hasData ? formatNumber(data.totalRemoval) : "-");
    text("forestryRemovalHuman", hasData && data.totalRemoval > 0 ? "≈ " + humanTon(data.totalRemoval) + " CO₂ diserap" : "");
    text("forestryEmission", hasData ? formatNumber(data.totalEmission) : "-");
    text("forestryNet", hasData ? formatNumber(data.netValue) : "-");

    const netEl = document.getElementById("forestryNet");
    netEl.className = "kpi-value " + (hasData ? (data.netValue < 0 ? "good" : "bad") : "");
    text(
      "forestryNetNote",

  async function loadNationalPage() {
    const firstLoad = !app.current.national;
    const seq = nextSeq("national");
    showLoading();
    try {
      const data = await cached("national", () => call("getNationalEmissionData"));
      if (!isLatest("national", seq)) return;
      const changed = app.current.national !== data;
      app.current.national = data;
      if (firstLoad || changed) {
        const years = [...data.years].sort((a, b) => a - b).map((y) => ({ value: y, label: y }));
        populateSelect("nationalStartYear", years, years.length ? years[0].value : null);
        populateSelect("nationalEndYear", years, years.length ? years[years.length - 1].value : null);
      }
      renderNationalPage();
    } catch (err) {
      handleError(err);
    } finally {
      hideLoading();
    }
  }

  function renderNationalPage() {
    const data = app.current.national;
    if (!data) return;

    const [start, end] = getYearRange("nationalStartYear", "nationalEndYear");
    const filtered = data.data.filter((d) => d.tahun >= start && d.tahun <= end);

    renderNationalKpi(data);
    if (filtered.length) {
      drawSectorCombo("nationalEmissionChart", data.sectors, filtered, { stacked: true, totalLabel: "Total nasional" });
    } else {
      showEmpty("nationalEmissionChart", "Tidak ada data pada rentang tahun ini.");
    }
    renderNationalTable(data.sectors, filtered);
  }

    if (data.latestTotal === null) {
      ["nationalTotal", "nationalLargestSector", "nationalLargestValue", "nationalChange", "nationalChangeYear"].forEach((id) => text(id, "-"));

  /* =========================
     KOMPONEN CHART
  ========================= */
  function baseChartOptions() {
    return {
      backgroundColor: "transparent",
      fontName: "Plus Jakarta Sans",
      fontSize: 12,
      tooltip: { textStyle: { fontSize: 13 } },
      animation: { duration: 400, easing: "out", startup: true },
    };
  }

  function prepareChartElement(id) {
    const el = document.getElementById(id);
    el.classList.remove("empty-state");
    el.textContent = "";
    return el;
  }

  function showEmpty(id, message) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add("empty-state");
    el.textContent = message;
  }

  /** Bar chart horizontal dengan warna per batang. items: [{label, value, color}] */
  function drawColoredBar(id, items) {
    const el = prepareChartElement(id);
    const table = new google.visualization.DataTable();
    table.addColumn("string", "Nama");
    table.addColumn("number", "kt CO₂e");
    table.addColumn({ type: "string", role: "style" });
    table.addColumn({ type: "string", role: "annotation" });
    items.forEach((i) => table.addRow([i.label, i.value, i.color, formatNumber(i.value)]));
    formatChartColumns(table, [1]);

    const longest = Math.max(...items.map((i) => String(i.label).length), 8);
    const left = Math.min(Math.max(longest * 7, 110), 260);

    new google.visualization.BarChart(el).draw(table, {
      ...baseChartOptions(),
      legend: { position: "none" },
      chartArea: { left, top: 10, right: 70, bottom: 45 },
      bar: { groupWidth: "65%" },
      annotations: { alwaysOutside: true, textStyle: { fontSize: 11, color: "#3d4f63", bold: true }, stem: { length: 0 } },
      hAxis: {
        title: "kt CO₂e (ribu ton)",
        format: "#,##0",
        baselineColor: "#64748b",
        gridlines: { color: "#eef2f6" },
        textStyle: { color: "#64748b", fontSize: 11 },
        titleTextStyle: { color: "#64748b", fontSize: 12, italic: false },
      },
      vAxis: { textStyle: { color: "#1b2a3a", fontSize: 12 } },
    });
  }

  /** Line chart. columns: nama seri; rows: [tahun, nilai1, nilai2, ...] */
  function drawLine(id, columns, rows, opts = {}) {
    const el = prepareChartElement(id);
    const table = new google.visualization.DataTable();
    table.addColumn("number", "Tahun");
    columns.forEach((c) => table.addColumn("number", c));
    rows.forEach((r) => table.addRow(r));
    formatChartColumns(table, columns.map((_, i) => i + 1), opts.decimals);

    const options = {
      ...baseChartOptions(),
      legend: columns.length > 1
        ? { position: opts.legendBottom ? "bottom" : "top", maxLines: 4, textStyle: { fontSize: 12, color: "#3d4f63" } }
        : { position: "none" },
      chartArea: { left: 80, top: 20, right: 30, bottom: columns.length > 1 && opts.legendBottom ? 90 : 50 },
      hAxis: {
        format: "####",
        gridlines: { color: "transparent" },
        textStyle: { color: "#64748b", fontSize: 11 },
        ticks: rows.map((r) => r[0]),
      },
      vAxis: {
        title: opts.vTitle || "kt CO₂e",
        baseline: 0,
        baselineColor: "#64748b",
        gridlines: { color: "#eef2f6" },
        minorGridlines: { color: "transparent" },
        textStyle: { color: "#64748b", fontSize: 11 },
        titleTextStyle: { color: "#64748b", fontSize: 12, italic: false },
      },
      lineWidth: 3,
      pointSize: 7,
      interpolateNulls: true,
      focusTarget: columns.length > 1 ? "category" : "datum",
    };
    if (opts.colors) options.colors = opts.colors;
    if (opts.decimals) options.vAxis.format = "#,##0.####";

    new google.visualization.LineChart(el).draw(table, options);
  }

  /** Combo chart: batang per sektor + garis total. */
  function drawSectorCombo(id, sectors, data, opts) {
    const el = prepareChartElement(id);
    const table = new google.visualization.DataTable();
    table.addColumn("string", "Tahun");
    sectors.forEach((s) => table.addColumn("number", sectorInfo(s).label));
    table.addColumn("number", opts.totalLabel);
    data.forEach((d) => table.addRow([String(d.tahun), ...sectors.map((s) => d.values[s] ?? 0), d.total]));
    formatChartColumns(table, sectors.map((_, i) => i + 1).concat(sectors.length + 1));

    const series = {};
    sectors.forEach((s, i) => { series[i] = { type: "bars", color: sectorInfo(s).color }; });
    series[sectors.length] = { type: "line", color: TOTAL_COLOR, lineWidth: 4, pointSize: 8 };

    const manyYears = data.length > 10;
    new google.visualization.ComboChart(el).draw(table, {
      ...baseChartOptions(),
      seriesType: "bars",
      isStacked: !!opts.stacked,
      series,
      bar: { groupWidth: opts.stacked ? "60%" : "75%" },
      chartArea: { left: 90, top: 20, right: 30, bottom: manyYears ? 110 : 90 },
      legend: { position: "bottom", alignment: "center", maxLines: 3, textStyle: { fontSize: 12, color: "#3d4f63" } },
      hAxis: {
        textStyle: { fontSize: 11, color: "#64748b" },
        slantedText: manyYears,
        slantedTextAngle: 45,
        gridlines: { color: "transparent" },
      },
      vAxis: {
        title: "kt CO₂e (ribu ton)",
        baseline: 0,
        baselineColor: "#475569",
        format: "#,##0",
        gridlines: { color: "#eef2f6" },
        minorGridlines: { color: "transparent" },
        textStyle: { color: "#64748b", fontSize: 11 },
        titleTextStyle: { color: "#64748b", fontSize: 12, italic: false },
      },
      focusTarget: "category",
    });
  }

  function formatChartColumns(table, columns, decimals = 2) {
    const formatter = new google.visualization.NumberFormat({
      decimalSymbol: ",",
      groupingSymbol: ".",
      fractionDigits: decimals,
    });
    columns.forEach((c) => formatter.format(table, c));
  }

  /* =========================
     INDIKATOR PERUBAHAN
  ========================= */
  /**
   * goodWhenUp: true untuk indikator yang sebaiknya naik (ADHK),
   * false untuk yang sebaiknya turun (emisi, intensitas).
   */
  function changeBadge(change, goodWhenUp) {
    if (change === null || change === undefined || !Number.isFinite(change)) return null;
    const flat = Math.abs(change) < 0.05;
    const up = change > 0;
    const cls = flat ? "neutral" : up === goodWhenUp ? "good" : "bad";
    const arrow = flat ? "→" : up ? "▲" : "▼";
    const word = flat ? "Relatif tetap" : up ? "Naik" : "Turun";
    return { cls, html: `<span class="badge ${cls}">${arrow} ${word} ${formatPercent(Math.abs(change))}</span>` };
  }

  function renderChangeKpi(valueId, noteId, change, previousYear, goodWhenUp, subject) {
    const valueEl = document.getElementById(valueId);
    const badge = changeBadge(change, goodWhenUp);

    if (!badge) {
      valueEl.textContent = "-";
      valueEl.className = "kpi-value";
      if (noteId) text(noteId, "Belum ada tahun pembanding");
      return;
    }

    valueEl.textContent = (change > 0 ? "+" : change < 0 ? "−" : "") + formatPercent(Math.abs(change));
    valueEl.className = "kpi-value " + (badge.cls === "neutral" ? "" : badge.cls);

    if (noteId) {
      const meaning = badge.cls === "neutral"
        ? `${subject} hampir sama`
        : change > 0 ? `${subject} bertambah` : `${subject} berkurang`;
      document.getElementById(noteId).innerHTML =
        `${badge.html} dibanding ${previousYear}<br><span>${meaning.charAt(0).toUpperCase() + meaning.slice(1)}${badge.cls === "good" ? " — kabar baik" : badge.cls === "bad" ? " — perlu perhatian" : ""}.</span>`;
    }
  }

  function renderChangeFooter(elementId, current, previous, previousYear, goodWhenUp) {
    const el = document.getElementById(elementId);
    if (current === null || current === undefined || previous === null || previous === undefined || Number(previous) === 0) {
      el.textContent = "Belum ada tahun pembanding";
      return;
    }
    const change = ((Number(current) - Number(previous)) / Math.abs(Number(previous))) * 100;
    el.innerHTML = `${changeBadge(change, goodWhenUp).html} dibanding ${previousYear}`;
  }

  function updateAuthUI() {

  function handleAuthClick() {
    if (app.session) {
      if (!confirm("Keluar dari akun operator?")) return;
      const token = app.session.token;
      storeSession(null);
      updateAuthUI();
      call("logout", token).catch(() => {});

  function openLoginModal() {
    document.getElementById("loginModal").hidden = false;
    document.getElementById("loginError").hidden = true;
    document.getElementById("loginPassword").value = "";
    setTimeout(() => document.getElementById("loginUsername").focus(), 50);
  }

  function closeLoginModal() {
    document.getElementById("loginModal").hidden = true;
  }

  async function handleLoginSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById("btnLoginSubmit");
    const errBox = document.getElementById("loginError");

    btn.disabled = true;
    btn.textContent = "Memeriksa…";
    errBox.hidden = true;

    try {
      const res = await call(
        "verifyLogin",
        document.getElementById("loginUsername").value,
        document.getElementById("loginPassword").value
      );
      if (!res.success) {
        errBox.textContent = res.message;
        errBox.hidden = false;
        return;
      }
      storeSession({ token: res.token, user: res.user, canWrite: res.canWrite });
      closeLoginModal();
      updateAuthUI();
      toast("Selamat datang, " + (res.user.nama || res.user.username) + ".", "success");
      if (res.canWrite) openPage("input");
      else toast("Akun Anda hanya bisa melihat data.", "error");
    } catch (err) {
      errBox.textContent = "Terjadi kendala koneksi. Coba lagi.";
      errBox.hidden = false;
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = "Masuk";
    }
  }

  function handleSessionExpired(err) {
    const message = String((err && err.message) || err || "");
    if (/sesi login sudah berakhir/i.test(message)) {
      storeSession(null);
      updateAuthUI();
      openLoginModal();
      toast("Sesi login berakhir. Silakan login kembali.", "error");
      return true;
    }
    return false;
  }

  /** Mengubah teks angka gaya Indonesia ("1.234,56") menjadi format yang dipahami server. */
  function normalizeNumberInput(raw) {
    let t = String(raw || "").trim().replace(/\s/g, "");
    if (!t) return null;
    if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
    const n = Number(t);
    return Number.isFinite(n) ? n : null;
  }

  async function handleFormSubmit(e, overwrite = false) {
    if (e) e.preventDefault();

    if (!app.session) {
      toast("Silakan login terlebih dahulu.", "error");
      openLoginModal();
      return;
    }

    const target = document.getElementById("inputTarget").value;
    const tahun = Number(document.getElementById("inputTahun").value);
    const nilai = normalizeNumberInput(document.getElementById("inputNilai").value);
    const sektor = document.getElementById("inputSektor").value;

    if (!Number.isInteger(tahun) || tahun < 1990 || tahun > 2100) {
      toast("Isi tahun dengan benar (1990–2100).", "error");
      return document.getElementById("inputTahun").focus();
    }
    if (!sektor) return toast("Pilih sektor terlebih dahulu.", "error");
    if (nilai === null) {
      toast("Nilai emisi harus berupa angka, contoh: 1234,56", "error");
      return document.getElementById("inputNilai").focus();
    }

    const payload = { targetTabel: target, tahun, sektor, nilai, overwrite };

    if (target === "DATA_SUBSEKTOR") {
      payload.subsektorId = document.getElementById("selectedSubsektorId").value;
      if (!payload.subsektorId) {
        toast("Pilih subsektor dari daftar pencarian.", "error");
        return document.getElementById("subsektorSearchInput").focus();
      }
    }

    const btn = document.getElementById("btnSubmitForm");
    btn.disabled = true;
    btn.textContent = "Menyimpan…";

    try {
      const res = await call("saveEmissionData", payload, app.session.token);

      if (res.duplicate) {
        const ok = confirm(
          `Data ${sectorInfo(sektor).label} tahun ${tahun} sudah ada dengan nilai ${formatNumber(res.existingValue)} kt CO₂e.\n\n` +
          `Ganti dengan nilai baru ${formatNumber(nilai)} kt CO₂e?`
        );
        if (ok) {
          btn.disabled = false;
          return await handleFormSubmit(null, true);
        }
        toast("Data tidak diubah.");
        return;
      }

      toast(res.message, "success");
      document.getElementById("inputNilai").value = "";
      if (target === "DATA_SUBSEKTOR") clearSubsektorSelection();
      await refreshAfterSave();
    } catch (err) {
      if (!handleSessionExpired(err)) handleError(err);
    } finally {
      btn.disabled = false;
      btn.textContent = "Simpan Data";
    }
  }

  async function refreshAfterSave() {
    app.cache = {};
    app.current = {};
    try {
      applyInitialData(await call("getInitialData"));
    } catch (err) {
      console.error(err);
    }
  }

  ========================= */
  function renderGuideSectors() {
    const codes = ["ENERGI", "IPPU", "PERTANIAN", "KEHUTANAN", "LIMBAH"];
    document.getElementById("guideSectors").innerHTML = codes
      .map((c) => {
        const info = sectorInfo(c);
        return `<span class="sector-name" style="margin-bottom:4px"><span class="sector-dot" style="background:${info.color}"></span>${escapeHtml(info.label)}</span>`;
      })
      .join("") + "Kelompok sumber emisi. Arahkan ke halaman <b>Rincian per Sektor</b> untuk penjelasan tiap sektor.";
  }

  function openGuide() {
    document.getElementById("guideModal").hidden = false;
  }

  function closeGuide() {
    document.getElementById("guideModal").hidden = true;
  }

  /* =========================
     FORMAT ANGKA (gaya Indonesia)
  ========================= */
  function formatID(value, decimals = 2) {
    if (value === null || value === undefined || value === "" || !Number.isFinite(Number(value))) return "-";
    return new Intl.NumberFormat("id-ID", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(Number(value));
  }

  function formatNumber(value, decimals = 2) {
    return formatID(value, decimals);
  }

  function formatPercent(value) {
    const f = formatID(value, 1);
    return f === "-" ? f : f + "%";
  }

  /** Mengubah kt menjadi kalimat mudah dibaca, contoh 1.234,5 kt → "1,23 juta ton". */
  function humanTon(kt) {
    if (kt === null || kt === undefined || !Number.isFinite(Number(kt))) return "-";
    const ton = Math.abs(Number(kt)) * 1000;
    const sign = Number(kt) < 0 ? "−" : "";
    if (ton >= 1e9) return sign + formatID(ton / 1e9, 2) + " miliar ton";
    if (ton >= 1e6) return sign + formatID(ton / 1e6, 2) + " juta ton";
    if (ton >= 1e3) return sign + formatID(ton / 1e3, 1) + " ribu ton";
    return sign + formatID(ton, 0) + " ton";
  }

  /* =========================
     UTILITAS
  ========================= */
  function text(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  let loadingCount = 0;

  function showLoading() {
    loadingCount++;
    document.getElementById("loading").hidden = false;
  }

  function hideLoading() {
    loadingCount = Math.max(0, loadingCount - 1);
    if (loadingCount === 0) document.getElementById("loading").hidden = true;
  }

  function toast(message, type = "") {
    const el = document.createElement("div");
    el.className = "toast " + type;
    el.textContent = message;
    document.getElementById("toastContainer").appendChild(el);
    setTimeout(() => el.remove(), type === "error" ? 6000 : 4000);
  }

  function handleError(error) {
    console.error(error);
    toast("Terjadi kesalahan: " + (error && error.message ? error.message : error), "error");
  }

  /* =========================
     RESIZE: GAMBAR ULANG CHART
  ========================= */
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const c = app.current;
      if (app.page === "summary" && c.summary) renderSummary(c.summary);
      if (app.page === "trend") {
        if (c.trend) renderAllSectorTrend();
        if (c.economic) renderEconomicData(c.economic);
      }
      if (app.page === "sector" && c.category && c.categoryTrend) renderCategory(c.category, c.categoryTrend);
      if (app.page === "national" && c.national) renderNationalPage();
      if (app.page === "forestry" && c.forestry) renderForestry(c.forestry);
    }, 250);
  });
</script>
